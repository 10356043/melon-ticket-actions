name: Check Melon Tickets

on:
  schedule:
    - cron: '*/5 * * * *' # 每 5 分鐘檢查一次
  workflow_dispatch:      # ⬅️ 加上這一行，網頁上就會出現手動執行的按鈕了！

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check Tickets
        uses: mooyoul/melon-ticket-actions@v1.1.0
        with:
          product-id: 213836
          schedule-id: 100002
          seat-id: 1_0
          slack-incoming-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
